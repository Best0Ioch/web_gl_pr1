<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>3D Surface with Phong Lighting</title>
    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #f5f5f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: 100vh;
        }
        h2 {
            margin-top: 20px;
            font-size: 28px;
            letter-spacing: 1px;
            text-align: center;
            color: #00e5ff;
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.6);
        }
        #message {
            margin: 10px 0 20px;
            text-align: center;
            font-size: 16px;
            color: #ddd;
        }
        #controls {
            margin: 10px 0 15px;
            padding: 12px 18px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }
        #controls label {
            font-size: 15px;
            margin-right: 5px;
        }
        #controls input {
            width: 60px;
            padding: 5px;
            border-radius: 6px;
            border: none;
            text-align: center;
            font-size: 15px;
        }
        #controls button {
            padding: 6px 14px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            background: #00e5ff;
            color: #111;
            font-weight: bold;
            transition: background 0.3s ease;
        }
        #controls button:hover {
            background: #00bcd4;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 10px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
        }
        .control-group span {
            font-weight: bold;
            color: #00e5ff;
        }
        #canvas-holder {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            width: 100%;
        }
        canvas {
            background-color: #111;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
        }
    </style>
    <script src="./Utils/trackball-rotator.js"></script>
    <script src="./Utils/m4.js"></script>
    <script src="./shader.gpu"></script>
    <script src="./Model.js"></script>
    <script src="./main.js"></script>
</head>
<body onload="init()">
    <h2>Interactive 3D Surface with Lighting</h2>
    <p id="message">Drag your mouse to rotate the object. Use mouse wheel to zoom.</p>
    
    <div id="controls">
        <label for="nValue">n:</label>
        <input type="number" id="nValue" value="6" min="1" max="50">
        <label for="uSteps">uSteps:</label>
        <input type="number" id="uSteps" value="50" min="20" max="200">
        <label for="vSteps">vSteps:</label>
        <input type="number" id="vSteps" value="50" min="20" max="200">
        <button onclick="updateSurface()">Update Surface</button>
    </div>

    <div class="control-group">
        <span>Light mode:</span>
        <label><input type="radio" name="lightMode" value="static" checked> Static </label>
        <label><input type="radio" name="lightMode" value="dynamic"> Dynamic </label>
    </div>

    <div id="canvas-holder">
        <canvas width="800" height="600" id="webglcanvas"></canvas>
    </div>
</body>
</html>
